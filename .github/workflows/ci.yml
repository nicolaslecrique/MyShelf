name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: new security advisories appear even when the code doesn't change.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: taiki-e/install-action@just
      - run: just fmt

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - run: just clippy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: just test

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@cargo-deny
      - run: just deny

  # The image is built in parallel with the checks above (so CI takes as long
  # as the slowest job, not the sum), on pushes to main only (not PRs, not the
  # weekly scheduled run). It is pushed under a `candidate-<sha>` tag only:
  # deployments accept full shas only, so a candidate can't be deployed.
  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Lowercases the image name (ghcr.io requires it) and adds OCI labels,
      # including the source repo, which links the package to this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long,prefix=candidate-
      - uses: docker/build-push-action@v7
        with:
          # amd64 only: that's what Scaleway Serverless Containers run.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse cached layers (notably the cargo-chef dependency layer).
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Once every check has passed, publish the candidate image: add the full
  # commit sha tag (what deployments pin to) and `latest`. A retag, not a
  # rebuild: the image published is exactly the one built above.
  publish:
    needs: [fmt, clippy, test, deny, docker]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "$repo:$GITHUB_SHA" \
            --tag "$repo:latest" \
            "$repo:candidate-$GITHUB_SHA"
