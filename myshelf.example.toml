# MyShelf configuration example. Every setting has a built-in default (shown
# commented out below), so no file is needed. To override some locally, copy
# this file to myshelf.toml (git-ignored) and uncomment what you change.
# Any key can also be set with an env var MYSHELF_<KEY> (e.g.
# MYSHELF_LISTEN_ADDRESS), which takes priority over the file. Deployments
# use env vars only.

# host:port the MCP HTTP server listens on.
# 127.0.0.1 = local only; use 0.0.0.0 to accept outside connections.
# listen_address = "127.0.0.1:3000"

# Host names accepted in the HTTP Host header (DNS-rebinding protection).
# When deployed, add the public hostname (e.g. Scaleway's *.scw.cloud one), or
# set MYSHELF_ALLOWED_HOSTS='["my-app.functions.fnc.fr-par.scw.cloud"]'.
# allowed_hosts = ["localhost", "127.0.0.1", "::1"]

# Which logs to keep: a level, optionally with per-crate
# levels. rmcp (the MCP library) is chatty at info.
# log_filter = "info,rmcp=warn"

# Login for the /mcp endpoint, with any OAuth / OpenID Connect provider (WorkOS
# AuthKit, Keycloak, Logto...). Without this section /mcp is not served, only
# /public/mcp (no login, public tools only). See README "Login".
# Env var form: MYSHELF_AUTH__ISSUER, MYSHELF_AUTH__RESOURCE, MYSHELF_AUTH__JWKS_URI.
# [auth]
# The provider's issuer, exactly as in its tokens' `iss` claim.
# issuer = "https://<name>.authkit.app"
# This server's public /mcp URL; tokens must carry it as their audience (`aud`).
# resource = "https://mcp.example.com/mcp"
# Optional: where the provider publishes its signing keys. By default, read from
# its metadata (<issuer>/.well-known/oauth-authorization-server or
# <issuer>/.well-known/openid-configuration).
# jwks_uri = "https://<name>.authkit.app/oauth2/jwks"
# Seconds after which the provider's signing keys are fetched again.
# keys_max_age_secs = 3600
# Minimum seconds between two fetches caused by tokens with an unknown key id.
# keys_min_refresh_interval_secs = 30
# Timeout, in seconds, of each request to the provider.
# http_timeout_secs = 5
