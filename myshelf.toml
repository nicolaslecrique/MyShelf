# MyShelf configuration. Any key can be overridden by an env var
# MYSHELF_<KEY> (e.g. MYSHELF_LISTEN_ADDRESS).

# host:port the MCP HTTP server listens on.
# 127.0.0.1 = local only; use 0.0.0.0 to accept outside connections.
listen_address = "127.0.0.1:3000"

# Host names accepted in the HTTP Host header (DNS-rebinding protection).
# When deployed, add the public hostname (e.g. Scaleway's *.scw.cloud one), or
# set MYSHELF_ALLOWED_HOSTS='["my-app.functions.fnc.fr-par.scw.cloud"]'.
allowed_hosts = ["localhost", "127.0.0.1", "::1"]
