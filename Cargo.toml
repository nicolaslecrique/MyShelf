[package]
name = "myshelf"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[dependencies]
axum = "0.8.9"
figment = { version = "0.10.19", features = ["toml", "env"] }
# Verifies the access tokens of logged-in users. aws_lc_rs: the same crypto
# library reqwest's TLS already uses (the pure-Rust `rsa` crate has an open
# timing advisory).
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs"] }
# Fetches the identity provider's metadata and signing keys.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-streamable-http-server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt", "json"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[dev-dependencies]
# Tests sign tokens with a PEM key (tests/fixtures/test_signing_key.pem).
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
rmcp = { version = "3.10.0", features = ["client", "transport-streamable-http-client-reqwest"] }

# No fat LTO / codegen-units = 1: they made the final (never cached) step of the
# Docker build ~6x slower (36s vs 6s locally) for a ~15% smaller binary.
[profile.release]
opt-level = 3
panic = "abort"
strip = true
