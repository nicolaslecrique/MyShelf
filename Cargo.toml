[package]
name = "myshelf"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
figment = { version = "0.10.19", features = ["toml", "env"] }
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-streamable-http-server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["full"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[dev-dependencies]
rmcp = { version = "3.10.0", features = ["client", "transport-streamable-http-client-reqwest"] }
