# cargo-deny policy. Lenient: fail on known vulnerabilities and non-permissive
# licenses, only warn on everything else. Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Unmaintained / unsound / yanked crates only warn; vulnerabilities always fail.
unmaintained = "workspace"
yanked = "warn"

[licenses]
# Permissive licenses for dependencies, plus the project's own license.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "AGPL-3.0-only",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
